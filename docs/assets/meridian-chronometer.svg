<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="100%" height="100%">
  <defs>
    <radialGradient id="chronoGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#050a17" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#02040a" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="sliderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.2"/>
      <stop offset="65%" stop-color="#00e5ff" stop-opacity="1"/>
      <stop offset="66%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.08)"/>
    </linearGradient>

    <pattern id="tickPattern" width="10" height="20" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="rgba(0, 229, 255, 0.2)" stroke-width="1"/>
      <line x1="5" y1="0" x2="5" y2="12" stroke="rgba(0, 229, 255, 0.4)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Chassis & Background -->
  <rect width="1100" height="420" fill="#03060f"/>
  <rect x="12" y="12" width="1076" height="396" rx="10" fill="url(#chronoGlow)" stroke="rgba(0, 229, 255, 0.35)" stroke-width="1.2"/>

  <!-- Swiss Chronometer Precision Corner Reticles -->
  <path d="M 8 32 L 8 8 L 32 8" fill="none" stroke="#00e5ff" stroke-width="2.5"/>
  <path d="M 1092 32 L 1092 8 L 1068 8" fill="none" stroke="#00e5ff" stroke-width="2.5"/>
  <path d="M 8 388 L 8 412 L 32 412" fill="none" stroke="#00e5ff" stroke-width="2.5"/>
  <path d="M 1092 388 L 1092 412 L 1068 412" fill="none" stroke="#00e5ff" stroke-width="2.5"/>

  <!-- Header Strip -->
  <g transform="translate(36, 44)">
    <rect x="0" y="0" width="1028" height="34" rx="6" fill="rgba(6, 11, 24, 0.7)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <circle cx="18" cy="17" r="4" fill="#00e5ff"/>
    <text x="32" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00e5ff" letter-spacing="1.5">MERIDIAN CHRONOMETER // PRECISION TIME CONTROL SEAM</text>
    <text x="760" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1">CHRONO DRIFT: <tspan fill="#10b981">0.00%</tspan> | SAMPLING: <tspan fill="#38bdf8">60 Hz RING</tspan></text>
  </g>

  <!-- Left Side: Circular Chrono Vernier Dial (Swiss Watchmaking) -->
  <g transform="translate(190, 245)">
    <!-- Outer Minute Ring -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="rgba(0, 229, 255, 0.15)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="105" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" stroke-dasharray="2,6"/>

    <!-- 12-Hour / 60-Second Graduation Ticks -->
    <g stroke="rgba(0, 229, 255, 0.4)" stroke-width="1.5">
      <line x1="0" y1="-120" x2="0" y2="-108"/>
      <line x1="120" y1="0" x2="108" y2="0"/>
      <line x1="0" y1="120" x2="0" y2="108"/>
      <line x1="-120" y1="0" x2="-108" y2="0"/>
      <line x1="84.8" y1="-84.8" x2="76.3" y2="-76.3"/>
      <line x1="84.8" y1="84.8" x2="76.3" y2="76.3"/>
      <line x1="-84.8" y1="84.8" x2="-76.3" y2="76.3"/>
      <line x1="-84.8" y1="-84.8" x2="-76.3" y2="-76.3"/>
    </g>

    <!-- Center Hub & Seconds Indicator Hand -->
    <circle cx="0" cy="0" r="48" fill="rgba(8, 14, 28, 0.9)" stroke="#00e5ff" stroke-width="1.2"/>
    <text x="0" y="-4" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#ffffff">2.5<tspan font-size="10" fill="#00e5ff">x</tspan></text>
    <text x="0" y="14" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#64748b" letter-spacing="1">WARP FACTOR</text>

    <!-- Sweep Hand -->
    <line x1="0" y1="0" x2="68" y2="-68" stroke="#00e5ff" stroke-width="2"/>
    <circle cx="68" cy="-68" r="3.5" fill="#38bdf8"/>
    <circle cx="0" cy="0" r="5" fill="#00e5ff"/>
  </g>

  <!-- Right Side: Lossless Ring Buffer & Time Scrubber Console -->
  <g transform="translate(370, 110)">
    <!-- Scrubber Card Box -->
    <rect x="0" y="0" width="690" height="270" rx="8" fill="rgba(8, 14, 26, 0.75)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

    <!-- Reticle Corners on Scrubber Card -->
    <path d="M 0 12 L 0 0 L 12 0" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
    <path d="M 690 12 L 690 0 L 678 0" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
    <path d="M 0 258 L 0 270 L 12 270" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
    <path d="M 690 258 L 690 270 L 678 270" fill="none" stroke="#00e5ff" stroke-width="1.5"/>

    <!-- Section Title -->
    <text x="28" y="36" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1">LOSSLESS TEMPORAL RING BUFFER</text>
    <text x="28" y="54" font-family="-apple-system, sans-serif" font-size="11.5" fill="#94a3b8">Continuous 300-state cyclic buffer supporting frame-stepping and bidirectional time scrubbing.</text>

    <!-- Scrubber Slider Bar -->
    <g transform="translate(28, 80)">
      <!-- Track background -->
      <rect x="0" y="8" width="634" height="8" rx="4" fill="url(#sliderGrad)"/>
      <!-- Tick Marks -->
      <rect x="0" y="0" width="634" height="24" fill="url(#tickPattern)" opacity="0.6"/>
      <!-- Scrubber Thumb (Handle) -->
      <circle cx="418" cy="12" r="10" fill="#00e5ff" stroke="#ffffff" stroke-width="2" filter="drop-shadow(0 0 6px rgba(0, 229, 255, 0.8))"/>
      <circle cx="418" cy="12" r="3.5" fill="#0a101f"/>
    </g>

    <!-- Telemetry Readouts Row -->
    <g transform="translate(28, 140)">
      <!-- Readout 1: Active Frame -->
      <rect x="0" y="0" width="145" height="52" rx="4" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(0, 229, 255, 0.25)" stroke-width="1"/>
      <text x="14" y="20" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#64748b">FRAME INDEX</text>
      <text x="14" y="40" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#00e5ff">198 <tspan font-size="11" fill="#64748b">/ 300</tspan></text>

      <!-- Readout 2: Simulation Time Elapsed -->
      <rect x="160" y="0" width="145" height="52" rx="4" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <text x="14" y="20" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#64748b">ELAPSED TIME</text>
      <text x="174" y="40" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#f59e0b">T+ 14.82s</text>

      <!-- Readout 3: Step Sub-Delta -->
      <rect x="320" y="0" width="145" height="52" rx="4" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <text x="14" y="20" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#64748b">SUBSTEP (DT)</text>
      <text x="334" y="40" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#38bdf8">0.0042 s</text>

      <!-- Readout 4: Integration Mode -->
      <rect x="480" y="0" width="154" height="52" rx="4" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
      <text x="14" y="20" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#64748b">INTEGRATION</text>
      <text x="494" y="40" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#10b981">SYMPLECTIC</text>
    </g>

    <!-- Action Button Bar -->
    <g transform="translate(28, 210)">
      <!-- Step Back Button -->
      <rect x="0" y="0" width="105" height="34" rx="4" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
      <text x="52" y="21" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#94a3b8">◄ STEP BACK</text>

      <!-- Play / Pause Button -->
      <rect x="115" y="0" width="105" height="34" rx="4" fill="rgba(0, 229, 255, 0.15)" stroke="#00e5ff" stroke-width="1"/>
      <text x="167" y="21" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00e5ff">❚❚ PAUSE</text>

      <!-- Step Forward Button -->
      <rect x="230" y="0" width="105" height="34" rx="4" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
      <text x="282" y="21" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#94a3b8">STEP FWD ►</text>

      <!-- Live Telemetry Status Pill -->
      <rect x="350" y="0" width="284" height="34" rx="4" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
      <circle cx="368" cy="17" r="4" fill="#10b981"/>
      <text x="382" y="21" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#34d399">REPLAY READY: PRESERVES EXACT MOMENTUM</text>
    </g>
  </g>
</svg>
