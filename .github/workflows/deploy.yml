name: Test & Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Read-only by default; only the deploy job gets Pages write and OIDC, so
# pull-request runs never hold deploy credentials.
permissions:
  contents: read

concurrency:
  group: 'pages-${{ github.ref }}'
  cancel-in-progress: false

jobs:
  test:
    name: Unit & Astrodynamics Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      # npm ci only: falling back to npm install hid lockfile drift.
      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Publish only what the page loads, not tests, docs or tooling output.
      - name: Stage site files
        run: |
          mkdir -p _site/docs
          cp -R index.html style.css src .nojekyll _site/
          cp -R docs/assets _site/docs/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
