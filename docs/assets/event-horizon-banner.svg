<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="50%" stop-color="#050812"/>
      <stop offset="100%" stop-color="#020306"/>
    </radialGradient>

    <radialGradient id="bhGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="dopplerDisk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.75"/>
      <stop offset="75%" stop-color="#ef4444" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#881337" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="jetGradNorth" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="jetGradSouth" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="hudBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 229, 255, 0.05)" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="1" fill="rgba(0, 229, 255, 0.25)"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="440" fill="url(#bgGrad)"/>
  <rect width="1200" height="440" fill="url(#grid)"/>

  <!-- Border & Corner Reticles -->
  <rect x="16" y="16" width="1168" height="408" fill="none" stroke="url(#hudBorder)" stroke-width="1" rx="8"/>

  <!-- Precision Corner Hairlines (Swiss Horology Brackets) -->
  <path d="M 12 36 L 12 12 L 36 12" fill="none" stroke="#00e5ff" stroke-width="2.5"/>
  <path d="M 1188 36 L 1188 12 L 1164 12" fill="none" stroke="#00e5ff" stroke-width="2.5"/>
  <path d="M 12 404 L 12 428 L 36 428" fill="none" stroke="#00e5ff" stroke-width="2.5"/>
  <path d="M 1188 404 L 1188 428 L 1164 428" fill="none" stroke="#00e5ff" stroke-width="2.5"/>

  <!-- Spacetime Curvature Warp Lines on Right Side -->
  <g opacity="0.35">
    <ellipse cx="940" cy="220" rx="220" ry="140" fill="none" stroke="#00e5ff" stroke-width="0.75" stroke-dasharray="4,4"/>
    <ellipse cx="940" cy="220" rx="160" ry="90" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2,3"/>
    <ellipse cx="940" cy="220" rx="110" ry="55" fill="none" stroke="#f59e0b" stroke-width="1.0"/>
  </g>

  <!-- Background Ambient Glow behind Black Hole -->
  <circle cx="940" cy="220" r="180" fill="url(#bhGlow)"/>

  <!-- Relativistic Pulsar Synchrotron Jets -->
  <g transform="rotate(-28 940 220)">
    <!-- North Jet Cone -->
    <polygon points="940,220 922,25 958,25" fill="url(#jetGradNorth)"/>
    <!-- South Jet Cone -->
    <polygon points="940,220 922,415 958,415" fill="url(#jetGradSouth)"/>
    <line x1="940" y1="15" x2="940" y2="425" stroke="#ffffff" stroke-width="1.2" opacity="0.75" stroke-dasharray="6,4"/>
  </g>

  <!-- Doppler-Beamed Accretion Disk (Tilted Ellipse) -->
  <g transform="rotate(-14 940 220)">
    <ellipse cx="940" cy="220" rx="170" ry="60" fill="none" stroke="url(#dopplerDisk)" stroke-width="24" opacity="0.85"/>
    <ellipse cx="940" cy="220" rx="170" ry="60" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.4"/>
    <!-- Differential Keplerian Streamers -->
    <ellipse cx="940" cy="220" rx="130" ry="42" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.7"/>
    <ellipse cx="940" cy="220" rx="90" ry="28" fill="none" stroke="#00e5ff" stroke-width="5" opacity="0.9"/>
  </g>

  <!-- Relativistic Photon Sphere Ring -->
  <circle cx="940" cy="220" r="54" fill="none" stroke="#00e5ff" stroke-width="2.5" opacity="0.85"/>

  <!-- Schwarzschild Event Horizon (Pure Black Void) -->
  <circle cx="940" cy="220" r="46" fill="#000000"/>
  <circle cx="940" cy="220" r="46" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.6"/>

  <!-- Gravitational Slingshot Orbital Trajectory Arc -->
  <path d="M 680 390 C 820 370, 890 310, 910 220 C 925 150, 970 120, 1140 105" fill="none" stroke="#10b981" stroke-width="2.0" stroke-dasharray="6,4"/>
  <!-- Spacecraft Marker on Trajectory -->
  <polygon points="910,212 918,226 902,226" fill="#00e5ff"/>
  <circle cx="910" cy="220" r="8" fill="none" stroke="#00e5ff" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="925" y="215" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#34d399">ODYSSEY PROBE (PERIAPSIS BOOST)</text>

  <!-- Left Side Typography & Aerospace Title -->
  <g transform="translate(60, 0)">
    <!-- Mission Telemetry Badge -->
    <g transform="translate(0, 68)">
      <rect x="0" y="0" width="280" height="24" rx="4" fill="rgba(0, 229, 255, 0.08)" stroke="rgba(0, 229, 255, 0.4)" stroke-width="1"/>
      <circle cx="12" cy="12" r="3.5" fill="#10b981"/>
      <text x="24" y="16" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#00e5ff" letter-spacing="1.5">ASTRODYNAMICS LAB // V2.0</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="152" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">EVENT HORIZON</text>
    <text x="2" y="184" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#38bdf8" letter-spacing="2.5">DETERMINISTIC N-BODY GRAVITY &amp; RELATIVISTIC SIMULATOR</text>

    <!-- Lead Paragraph -->
    <text x="2" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" fill="#94a3b8">
      <tspan x="2" dy="0">A high-precision, zero-dependency astrophysics laboratory engineered with</tspan>
      <tspan x="2" dy="22">symplectic Velocity Verlet integration, relativistic frame-dragging, and an</tspan>
      <tspan x="2" dy="22">interactive spacecraft flight simulator. Built for 60 FPS Retina displays.</tspan>
    </text>

    <!-- Key Metrics Grid Cards -->
    <g transform="translate(0, 305)">
      <!-- Metric 1: Zero Dependencies -->
      <g transform="translate(0, 0)">
        <rect width="125" height="58" rx="6" fill="rgba(8, 14, 26, 0.85)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
        <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800" fill="#10b981">0 DEPS</text>
        <text x="14" y="44" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#64748b" letter-spacing="0.5">100% VANILLA JS</text>
      </g>

      <!-- Metric 2: 8,032 RPS Server -->
      <g transform="translate(137, 0)">
        <rect width="125" height="58" rx="6" fill="rgba(8, 14, 26, 0.85)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
        <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800" fill="#f59e0b">8,032</text>
        <text x="14" y="44" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#64748b" letter-spacing="0.5">REQ / SEC LOAD</text>
      </g>

      <!-- Metric 3: Symplectic Verlet -->
      <g transform="translate(274, 0)">
        <rect width="135" height="58" rx="6" fill="rgba(8, 14, 26, 0.85)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
        <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800" fill="#00e5ff">VERLET</text>
        <text x="14" y="44" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#64748b" letter-spacing="0.5">ENERGY INVARIANCE</text>
      </g>

      <!-- Metric 4: 95 Passing Tests -->
      <g transform="translate(421, 0)">
        <rect width="125" height="58" rx="6" fill="rgba(8, 14, 26, 0.85)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
        <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800" fill="#38bdf8">95 / 95</text>
        <text x="14" y="44" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#64748b" letter-spacing="0.5">TESTS PASSING</text>
      </g>
    </g>

    <!-- Bottom Telemetry Ticks -->
    <text x="2" y="398" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="500" fill="#475569" letter-spacing="1">
      COORDINATES: +42° 18' 04" // METRIC: SCHWARZSCHILD // INTEGRATOR: SYMPLECTIC VERLET-2 // DPR: 2.0x
    </text>
  </g>
</svg>
